name: PHPUnit

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # main.inc.php refuses to load unless the plugin folder is named
        # core_privacy_toggle, so check out into a matching path.
        working-directory: plugins/core_privacy_toggle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: plugins/core_privacy_toggle
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPUnit tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --testdox
